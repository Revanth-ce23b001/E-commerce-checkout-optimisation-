# =============================================================================
# params.yaml - THE single source of every business assumption in this project.
#
# Spec 13. Nothing in src/ may contain a business literal; if a number matters,
# it lives here.
#
# TWO HARD RULES (spec 13.3, CLAUDE.md rule 1):
#   1. Every `*_solved` field is MACHINE-WRITTEN ONLY. The calibrator writes it
#      and stamps calibration.dgp_sha256. Hand-editing one breaks reproducibility
#      and src/config/loader.py will refuse to load the file.
#   2. Every slope is IMMUTABLE. If a calibration target cannot be reached with
#      these slopes, that is a FINDING about the Phase 1 assumption set - it is
#      escalated and documented, never silently fixed. CAL-09 enforces this
#      against what the generator actually consumed at runtime.
#
# SEVEN calibrated LEVELS, all machine-written:
#   cod_model.intercept_solved            beta_0
#   rto_model.intercept_solved            gamma_0
#   conversion_model.intercept_solved     alpha_0        (A2)
#   pre_window_cod_model.intercept_solved pi_cod0        (A11)
#   pre_window_rto_model.intercept_solved pi_rto0        (A11)
#   distributions.product_price_scalar_solved            (A36)
#   rto_model.post_dispatch_shock.noise_sd_solved        (A37)
# Every one is a LEVEL. Zero slopes move, and zero category RATIOS move.
# =============================================================================

meta:
  version: "2.0.0"
  currency: INR
  window_days: 90
  window_start: 2026-01-01
  generator_version: "2.0.0"

# -----------------------------------------------------------------------------
# SCALE - spec 13.2, 15
# -----------------------------------------------------------------------------
scale:
  n_customers: 55000
  n_sellers: 1200
  n_products: 8000
  n_geographies: 500
  target_orders: 100000                   # VOL-01 floor. A business target.
  checkout_conversion_target: 0.68        # CAL-06 target. A business target.
  # Decision A31: n_sessions is an INPUT KNOB, not a business target. It was
  # previously derived as target_orders / conversion_target = 147,059, which made
  # VOL-01 require conversion >= EXACTLY 68.00% -- the midpoint of CAL-06's own
  # +/-2pp band. Any conversion CAL-06 permits below that failed VOL-01.
  #
  # 155,000 clears VOL-01 across the ENTIRE CAL-06 band, with headroom for the
  # re-solve once the A1 day loop closes:
  #     conversion 0.660 -> 102,300 orders
  #     conversion 0.680 -> 105,400 orders
  #     conversion 0.700 -> 108,500 orders
  n_sessions: 155000

  # Population framing (blueprint 7.2, deviation D1)
  population_annual_orders: 24000000      # FIXED business assumption

  # ---------------------------------------------------------------------------
  # THE ANNUALISATION FACTOR IS DERIVED, NEVER HARD-CODED.
  #
  #     factor = population_annual_orders / COUNT(fct_order)
  #
  # The old literal 240 was 24,000,000 / 100,000. It silently encoded an
  # assumption about the SAMPLE SIZE, so changing n_sessions would have inflated
  # the annual opportunity by ~4.8% -- the 165 Cr headline drifting to ~173 Cr
  # for no reason but a knob that has nothing to do with the business.
  #
  # Total RTO cost x (population / sample) is invariant to sample size, which is
  # exactly why the factor must be derived rather than pinned.
  #
  # The value below is REPORTING ONLY and must never enter a calculation.
  # EC-08 (HARD) asserts the derived factor lands inside the bounds.
  # ---------------------------------------------------------------------------
  annualization_factor_expected: 240
  annualization_factor_bounds: {lo: 200, hi: 280}   # EC-08, HARD

# Decision A31: VOL-02's old [145,000, 150,000] HARD band was a session-count
# level derived from a point estimate of conversion. Session count is an input,
# so a level test on it was testing the knob rather than the data.
volume_targets:
  vol_01_min_orders: 100000                          # HARD - the case-study headline
  vol_02a_session_band: {lo: 145000, hi: 170000}     # SOFT - sanity, not a target
  # HARD, but an INTERNAL CONSISTENCY check rather than a level check: the
  # reported conversion rate must actually equal orders / sessions.
  vol_02b_conversion_consistency_tol: 0.001

# -----------------------------------------------------------------------------
# CALIBRATION TARGETS - what the emergent data must reproduce (spec 17 CAL/EC).
# These are TARGETS THE DATA MAY MISS. A miss is a finding, not a licence to tune.
# -----------------------------------------------------------------------------
# Decision A7: three HARD RTO targets against ONE degree of freedom (gamma_0) is
# a spec inconsistency. gamma_0 is calibrated against the BLENDED rate alone --
# the one target that is a true function of it. The COD and prepaid rates, and
# the gap between them, are EMERGENT from the fixed is_cod = +1.60 plus whatever
# selection the COD model produces. They are reported as emergent, not as inputs.
# No second knob is added: widening the gap would require moving latent slopes,
# which CAL-09 forbids.
calibration_targets:
  cod_share:                    {target: 0.620, tol: 0.010, severity: HARD}   # CAL-01
  prepaid_share:                {target: 0.380, tol: 0.010, severity: HARD}   # CAL-02
  # CAL-03/04: DOWNGRADED to SOFT, widened to +/-2.5pp. EMERGENT, NOT CALIBRATED.
  rto_rate_cod:                 {target: 0.240, tol: 0.025, severity: SOFT,
                                 emergent: true}                              # CAL-03
  rto_rate_prepaid:             {target: 0.041, tol: 0.025, severity: SOFT,
                                 emergent: true}                              # CAL-04
  # CAL-05: the ONLY RTO target gamma_0 is calibrated against. Stays HARD.
  rto_rate_blended:             {target: 0.165, tol: 0.010, severity: HARD}   # CAL-05
  checkout_conversion:          {target: 0.680, tol: 0.020, severity: HARD}   # CAL-06
  pct_cod_from_payment_failure: {target: 0.068, tol: 0.020, severity: SOFT}   # CAL-07
  addressable_share_of_rto:     {target: 0.650, tol: 0.050, severity: SOFT}   # CAL-08
  # Decision A34: a Phase 2A internal inconsistency, now resolved in favour of
  # Phase 1 6.5, which is unambiguous: GMV 1,000 - 8% discount = net revenue 920.
  # 24M x 1,000 = 2,400 Cr, which is what the whole 165 Cr model rests on.
  mean_gmv_per_order:           {target: 1000,  tol: 25,    severity: HARD}   # EC-01
  mean_order_value_per_order:   {target: 920,   tol: 30,    severity: SOFT}   # EC-01b
  # EC-02: restated to the as-built value. The median is a SUMMARY of the
  # category-mixture lognormal, not an assumption -- the 690 was estimated by eye
  # and the mixture produces 624. Marked emergent for the same reason CAL-03/04
  # are: it is an output, and treating an output as a target invites tuning.
  median_order_value:           {target: 624,   tol: 60,    severity: SOFT,
                                 emergent: true}                              # EC-02
  auc_ceiling:                  {target: 0.760, tol: 0.030, severity: SOFT}   # GT-05
  # Pre-window history (decision A11). SOFT: these seed the point-in-time
  # features, they are not themselves a Phase 1 deliverable.
  pre_window_cod_share:         {target: 0.620, tol: 0.020, severity: SOFT}
  pre_window_rto_rate:          {target: 0.165, tol: 0.020, severity: SOFT}

# CAL-11 (HARD) -- decision A7. THE REAL GATE ON THIS DATASET.
#
#   selection_share = (naive_gap - AME) / naive_gap
#
# The entire analytical payoff of this project is "naive analysis overstates the
# COD effect by roughly a third". If selection share lands at 8% or at 60%, the
# dataset no longer supports the case study -- regardless of whether the RTO rate
# levels hit their targets. This is HARD precisely where CAL-03/04 no longer are.
selection_share_gate:
  lo: 0.25
  hi: 0.45
  severity: HARD

# Decision A5: 1,000 rupees is mean GMV PER ORDER, not mean order_value.
# order_value = gmv - discount_amount, so mean order_value emerges at ~920.
# Reported as descriptive figures; not tests.
reported_not_tested:
  switch_cod_share_of_final_cod_pp: 3.5    # spec 7.3 framing
  switch_cod_share_of_all_orders: 0.042    # spec 10.3 framing - decision A16

# -----------------------------------------------------------------------------
# DISTRIBUTIONS - spec 13.2, 12.1
# -----------------------------------------------------------------------------
distributions:
  geo_tier_weights:      {METRO: 0.22, TIER1: 0.24, TIER2: 0.28, TIER3: 0.26}
  category_weights:      {FASHION: 0.30, BEAUTY: 0.12, HOME_KITCHEN: 0.15,
                          MOBILE_ACC: 0.18, ELECTRONICS: 0.10, GROCERY_FMCG: 0.15}
  category_mean_gmv:     {FASHION: 850, BEAUTY: 650, HOME_KITCHEN: 1150,
                          MOBILE_ACC: 550, ELECTRONICS: 2900, GROCERY_FMCG: 700}
  category_gmv_sigma:    {FASHION: 0.55, BEAUTY: 0.50, HOME_KITCHEN: 0.60,
                          MOBILE_ACC: 0.52, ELECTRONICS: 0.75, GROCERY_FMCG: 0.45}
  gmv_truncation:        {lo: 149, hi: 60000}
  # Decision A36 - the SIXTH calibrated level. Machine-written, bisection-solved.
  # Applied MULTIPLICATIVELY to every category_mean_gmv, so the relative category
  # mix is preserved exactly and only the level moves. It exists because EC-01 is
  # measured on ORDERS, and conversion selects against expensive carts at -0.18,
  # so the order population is a value-selected sample of the session population.
  # Hand-editing the category means instead would destroy the audit trail and
  # would have to be redone every time conversion moved.
  product_price_scalar_solved: null
  seller_rating:         {dist: beta_scaled, a: 6.0, b: 2.2, lo: 2.5, hi: 5.0}
  product_rating:        {dist: beta_scaled, a: 5.4, b: 2.0, lo: 1.5, hi: 5.0}
  review_count:          {dist: lognormal, mu: 3.6, sigma: 1.4, max: 25000}
  pre_window_orders:     {dist: neg_binomial, r: 1.6, p: 0.30, zero_inflation: 0.28}
  cart_size_weights:     {1: 0.52, 2: 0.24, 3: 0.13, 4: 0.07, 5: 0.04}
  device_type_weights:   {ANDROID: 0.62, IOS: 0.16, WEB: 0.22}
  weight_band_weights:   {LIGHT: 0.55, MEDIUM: 0.33, HEAVY: 0.12}
  # ===========================================================================
  # [A27 - PROPOSED, NOT YET APPROVED]
  #
  # Every value from here to the end of this block is a distribution the spec
  # requires but never quantified. Modules 02-07 cannot run without them. They
  # are written here, visibly tagged, rather than buried as literals in src/ --
  # but they are NOT approved, and each is listed in decision_register.md A27
  # with its rationale.
  #
  # None of them feeds a calibration target or a planted causal coefficient.
  # They shape realism (names, tiers, ratings, volume seasonality), not the
  # relationships the project exists to measure. That is why proceeding on them
  # is contained rather than reckless -- but they still need sign-off.
  # ===========================================================================

  # Module 02 - dim_date.demand_index. Spec: "weekly seasonality + month-end".
  demand:
    weekday_multiplier: {1: 0.96, 2: 0.94, 3: 0.96, 4: 1.00, 5: 1.09, 6: 1.12, 7: 1.03}
    month_end_multiplier: 1.08          # is_month_end_window
    salary_week_multiplier: 1.06        # is_salary_week
    noise_sd: 0.04

  # Module 03 - dim_geography. Tier drives access, not trust (see the
  # cod_cultural_index note in the DDL).
  geography:
    serviceability:      {METRO: 0.88, TIER1: 0.78, TIER2: 0.64, TIER3: 0.48, sd: 0.09}
    courier_reliability: {METRO: 0.86, TIER1: 0.80, TIER2: 0.71, TIER3: 0.61, sd: 0.08}
    base_delivery_days:  {METRO: 2.6, TIER1: 3.4, TIER2: 4.6, TIER3: 6.1, sd: 0.5}
    # Deliberately NOT tier-ordered the same way as serviceability: COD norms are
    # a separate channel from access. Tier-1 is the most COD-normative band.
    cod_cultural_index:  {METRO: 0.44, TIER1: 0.68, TIER2: 0.72, TIER3: 0.66, sd: 0.11}

  # Module 04 - dim_seller.
  seller:
    tenure_days:            {dist: lognormal, mu: 6.1, sigma: 0.75, max: 3650}
    rating_count:           {dist: lognormal, mu: 5.2, sigma: 1.3, max: 60000}
    sla_breach_rate:        {dist: beta, a: 2.0, b: 22.0}      # mean ~0.083
    cancellation_rate:      {dist: beta, a: 1.6, b: 74.0}      # mean ~0.021
    fulfilment_model_weights: {PLATFORM: 0.62, SELLER_SHIP: 0.38}
    # seller_tier is DERIVED from rating and SLA breach, not drawn.
    tier_thresholds:
      GOLD:   {min_rating: 4.5, max_sla_breach: 0.06}
      SILVER: {min_rating: 4.0, max_sla_breach: 0.12}
      # everything else is BRONZE

  # Module 05 - dim_product.
  product:
    base_discount_pct: {dist: beta, a: 2.6, b: 29.0}           # mean ~0.082
    is_returnable_by_category: {FASHION: 0.97, BEAUTY: 0.80, HOME_KITCHEN: 0.93,
                                MOBILE_ACC: 0.90, ELECTRONICS: 0.95, GROCERY_FMCG: 0.35}
    weight_band_by_category:
      FASHION:      {LIGHT: 0.78, MEDIUM: 0.20, HEAVY: 0.02}
      BEAUTY:       {LIGHT: 0.92, MEDIUM: 0.07, HEAVY: 0.01}
      HOME_KITCHEN: {LIGHT: 0.24, MEDIUM: 0.46, HEAVY: 0.30}
      MOBILE_ACC:   {LIGHT: 0.95, MEDIUM: 0.05, HEAVY: 0.00}
      ELECTRONICS:  {LIGHT: 0.34, MEDIUM: 0.44, HEAVY: 0.22}
      GROCERY_FMCG: {LIGHT: 0.40, MEDIUM: 0.44, HEAVY: 0.16}

  # Module 06 - dim_customer.
  customer:
    tenure_days_at_window_start: {dist: lognormal, mu: 5.4, sigma: 1.0, max: 2200}
    age_bucket_weights: {"18-24": 0.19, "25-34": 0.38, "35-44": 0.24,
                         "45-54": 0.13, "55+": 0.06}
    acquisition_channel_weights: {ORGANIC: 0.34, PAID_SOCIAL: 0.31,
                                  PAID_SEARCH: 0.22, REFERRAL: 0.13}
    # Mechanical ceiling on any prepaid-shift intervention (H7 limitation).
    # Rises with trust and liquidity, which is why it is not a flat rate.
    saved_instrument_base_rate: 0.46
    saved_instrument_trust_weight: 0.55       # z-units -> logit
    saved_instrument_liquidity_weight: 0.45

  # Module 07 - pre-window history. Order frequency is NOT latent-driven
  # (decision A11): it appears in no Phase 1 hypothesis.
  pre_window:
    min_days_between_orders: 21        # caps pre_window_orders by tenure_days
    # No switch-to-COD modelling pre-window: the switch mechanism is an
    # in-window behaviour tied to a live payment session. Documented, not silent.
    model_switch_to_cod: false

  # ===========================================================================
  # [A28 - PROPOSED, NOT YET APPROVED]  Modules 08-12.
  # Same status as the A27 block above: required by the spec, never quantified
  # by it. Listed in decision_register.md A28 with rationale.
  # ===========================================================================

  # Module 08 - fct_checkout_session.
  session:
    # Sessions are allocated uniformly at random across customers, so the
    # per-customer count is ~Poisson(sessions/customers). Repeat-visit
    # propensity is NOT latent-driven: no Phase 1 hypothesis involves visit
    # frequency, and making it latent-driven would add a second, unasked-for
    # path from latent_intent into the point-in-time features.
    allocation: uniform_over_customers
    # Most sessions ship to the customer's home cluster.
    away_geography_rate: 0.06
    # Address quality. Drawn INDEPENDENTLY of tier and of every latent: spec 3.6
    # lists no drivers, and geography's access channel is already carried by
    # serviceability_score. Keeping it independent also keeps the cheapest
    # intervention lever clean - if address quality were a tier proxy, the
    # "fix addresses" recommendation would silently become a geography policy.
    address_completeness: {dist: beta, a: 6.5, b: 2.2}    # mean ~0.747
    est_delivery_days_noise_sd: 0.9
    # Single-line orders (spec 1.5). cart_size is the optionality proxy;
    # quantity is how many units of the ONE ordered product.
    quantity_weights: {1: 0.90, 2: 0.075, 3: 0.025}       # mean 1.125
    # Relative session volume by hour, local time. Evening-heavy.
    hour_of_day_weights: [0.6, 0.4, 0.3, 0.2, 0.2, 0.3, 0.5, 0.8,
                          1.0, 1.2, 1.3, 1.3, 1.2, 1.1, 1.1, 1.2,
                          1.4, 1.6, 1.9, 2.2, 2.3, 2.0, 1.5, 1.0]
    # discount_pct: product base discount, nudged by deal-seeking, plus noise.
    # Spec 12.2 names these drivers but gives no magnitudes.
    discount_price_sensitivity_weight: 0.012              # per z-unit
    discount_noise_sd: 0.020
    discount_bounds: {lo: 0.0, hi: 0.60}

  # Module 09 - pit_risk_tier_rule_based. Decision A21: the M1 (pre-selection)
  # baseline uses PRIOR RTO + TENURE only. payment_method belongs to the M2
  # baseline on fct_order and must not appear in a Stage-2 feature.
  # The HIGH cut sits at the break-even RTO probability from blueprint 6.6, so
  # the rule baseline and the economic threshold agree by construction.
  risk_tier_rules:
    high_rto_rate_shrunk: 0.257            # p*, the break-even RTO probability
    med_rto_rate_shrunk: 0.165             # the population blended rate
    med_if_new_customer: true
    # The THIRD rule of blueprint 9.3's baseline ("payment method + prior RTO +
    # tenure"). It belongs to M2 only: fct_order.order_risk_tier_rule_based.
    # It must never touch the Stage-2 pit_risk_tier_rule_based (decision A21).
    m2_cod_escalates_one_tier: true

  # ===========================================================================
  # [A33 - PROPOSED, NOT YET APPROVED]  Modules 13-17.
  # Same status as A27/A28. Required by the spec, never quantified by it.
  # ===========================================================================
  delivery:
    # Transit time, in multiples of the destination cluster's base_delivery_days.
    # Worse couriers are slower, which is what gives attempt_delay_days its
    # correlation with courier_reliability_score - and therefore what makes the
    # Stage-2 shock a real logistics signal rather than pure noise.
    transit_multiplier_mean: 1.00
    transit_multiplier_sd: 0.28
    courier_reliability_transit_weight: 0.45   # per z-unit, NEGATIVE reliability
    attempt_gap_days: 2                        # between failed delivery attempts
    rto_initiation_days: 2                     # final failed attempt -> RTO_INITIATED
    rto_return_days: {dist: lognormal, mu: 1.35, sigma: 0.40}
    courier_partners: [Bluewing, Raptor Logistics, Nandi Express, Trident Ship, Kestrel]

  # Modules 11a / 11b - the two conversion hurdles (decision A26).
  conversion:
    # One logit gives p_convert; it is split across the two hurdles as
    #   p_address = p_convert ** s      p_payment_page = p_convert ** (1 - s)
    # so the product is exactly p_convert by construction. s is the share of
    # log-survival attributed to the address step. Payment-page-weighted,
    # because that is where real checkouts shed most traffic.
    address_hurdle_share: 0.35
    # Outer loop: alpha_0 (conversion) and beta_0 (COD) are interdependent --
    # payment failure removes sessions, and who fails depends on prepaid intent.
    # Solve them alternately until both are stable.
    joint_solve_passes: 3

  # Centring constants used by the logits. Reference points, not slopes.
  centering:
    seller_rating_center: 4.30
    product_rating_center: 4.20
    est_delivery_days_center: 4
    discount_pct_center: 0.08
    discount_pct_unit: 0.10           # coefficients are stated "per 10pp"
    order_value_scale: 1000           # log(order_value / 1000)

# -----------------------------------------------------------------------------
# LATENTS - spec 6.1. Hidden from every analyst-visible surface.
# -----------------------------------------------------------------------------
latents:
  correlations: {trust_liquidity: 0.25, intent_liquidity: -0.20, intent_trust: -0.15}
  liquidity_geo_tier_shift: {METRO: 0.45, TIER1: 0.15, TIER2: -0.15, TIER3: -0.45}
  price_sensitivity_liquidity_corr: -0.30

# -----------------------------------------------------------------------------
# LATENT -> PRE-WINDOW HISTORY - decision A11 (RULED). The load-bearing one.
#
# Pre-window and in-window behaviour SHARE THE SAME LATENT SLOPES. That shared
# structure is exactly why prior RTO predicts future RTO (H3 / BR-02) and prior
# COD predicts future COD (BR-03). Break it and the confounding becomes noise:
# pit_cod_share (+2.20) and pit_rto_rate_shrunk (+2.80) -- the two strongest
# observables in the project -- would carry no signal, and the naive-vs-adjusted
# gap this project exists to produce would collapse toward zero.
#
# NO NEW SLOPES. The blocks below declare only which already-approved
# coefficients are re-used, plus two new INTERCEPTS. Order frequency is
# deliberately NOT latent-driven: it appears in no Phase 1 hypothesis, so
# inventing a coefficient for it would be an unanchored assumption.
# -----------------------------------------------------------------------------
latent_to_history:
  # pre_window_orders: neg-binomial per distributions.pre_window_orders, capped
  # by tenure_days. NOT latent-driven.
  orders_latent_driven: false
  orders_cap_basis: tenure_days
  # Which coefficients each pre-window draw re-uses, by dotted path. The
  # generator resolves these from params rather than restating any number, so
  # CAL-09 sees one value per coefficient and a divergence is impossible.
  cod_reused_coefficients:
    - cod_model.coefficients.latent_trust
    - cod_model.coefficients.latent_liquidity
    - cod_model.coefficients.latent_intent
    - cod_model.coefficients.latent_price_sensitivity
    - cod_model.coefficients.geo_tier
  rto_reused_coefficients:
    - rto_model.coefficients.is_cod
    - rto_model.coefficients.latent_intent
    - rto_model.coefficients.latent_liquidity
    - rto_model.coefficients.latent_trust
    - rto_model.coefficients.geo_tier

# Pre-window COD draw. LEVEL only -- pi_cod0 is calibrated, nothing else moves.
pre_window_cod_model:
  intercept_solved: null                   # pi_cod0; machine-written
  coefficients: {}                         # intentionally empty: slopes are
                                           # re-used from cod_model via
                                           # latent_to_history.cod_reused_coefficients
  reuses: cod_model

# Pre-window RTO draw. LEVEL only -- pi_rto0 is calibrated, nothing else moves.
pre_window_rto_model:
  intercept_solved: null                   # pi_rto0; machine-written
  coefficients: {}
  reuses: rto_model

# -----------------------------------------------------------------------------
# COD MODEL - spec 7.2. STEP A: intent.
# -----------------------------------------------------------------------------
cod_model:
  intercept_solved: null                   # machine-written; expected ~ +0.30
  coefficients:                            # FIXED A PRIORI - CAL-09 enforces
    latent_trust: -0.55
    latent_liquidity: -0.45
    latent_intent: 0.40
    latent_price_sensitivity: 0.12
    pit_cod_share: 2.20
    log1p_prepaid_success: -0.35
    is_new_customer: 0.70
    log1p_orders_delivered: -0.18
    payment_failure_rate: 1.10
    has_saved_instrument: -0.60
    geo_tier: {METRO: -0.45, TIER1: -0.15, TIER2: 0.25, TIER3: 0.55}
    cod_cultural_index_z: 0.30
    log_order_value: 0.28
    log_order_value_sq: -0.12
    seller_rating_centered: -0.35
    product_rating_centered: -0.30
    log1p_review_count_centered: -0.12
    est_delivery_days_centered: 0.09
    discount_pct_centered: 0.15
    cart_size_ge3: 0.22
    category: {FASHION: 0.30, BEAUTY: 0.10, HOME_KITCHEN: 0.05,
               MOBILE_ACC: 0.15, ELECTRONICS: -0.35, GROCERY_FMCG: -0.10}
    is_month_end: 0.14
  noise_sd: 0.35

# -----------------------------------------------------------------------------
# RTO MODEL - spec 8.2. Two stages.
# -----------------------------------------------------------------------------
rto_model:
  intercept_solved: null                   # machine-written. NOT a spec constant.
  coefficients:                            # FIXED A PRIORI - CAL-09 enforces
    is_cod: 1.60                           # *** THE PLANTED CAUSAL EFFECT ***
    paid_via_switch: -0.45
    pit_rto_rate_shrunk: 2.80
    latent_intent: 0.70
    latent_liquidity: -0.55
    latent_trust: -0.30
    is_new_customer: 0.45
    log1p_orders_delivered: -0.22
    pit_cod_share: 0.35
    geo_tier: {METRO: -0.35, TIER1: -0.10, TIER2: 0.20, TIER3: 0.45}
    serviceability_z: -0.25
    address_completeness: -1.40
    seller_sla_breach_rate: 1.20
    seller_rating_centered: -0.28
    product_rating_centered: -0.15
    log1p_review_count_centered: -0.05     # PLANTED NULL - GT-04 must not reject zero
    log_order_value: 0.15
    discount_pct_centered: 0.18
    cart_size_ge3: 0.25
    est_delivery_days_centered: 0.11
    category: {FASHION: 0.35, BEAUTY: 0.05, HOME_KITCHEN: 0.00,
               MOBILE_ACC: 0.10, ELECTRONICS: -0.20, GROCERY_FMCG: -0.15}
    month_end_x_cod: 0.30
  post_dispatch_shock:                     # Stage 2 - exists only after dispatch
    courier_reliability_z_neg: 0.40        # delta_1
    attempt_delay_days: 0.22               # delta_2 - decision A8: RENAMED
    seller_dispatch_late: 0.25             # delta_3
    # A33-amendment. A NEW COEFFICIENT, not one that existed and moved.
    # Condition (a) required attempt_delay_days to derive from BOTH courier
    # reliability and seller SLA breach; the draft only had the first, so delta_3
    # was multiplying a flag with no relationship to seller_sla_breach_rate.
    # In log-space: a +1sd breach-rate seller dispatches exp(0.35) = 1.42x slower.
    # Seller-level only -- nothing customer-level enters (condition (c)).
    # Lives HERE, in the shock block, so CAL-09 freezes it like every other slope.
    seller_sla_dispatch_weight: 0.35
    # Decision A37 - the SEVENTH calibrated level. Spec 13.2 annotates this
    # "the AUC ceiling lever" and GT-05 states the ceiling as a TARGET, so it is
    # calibrated against its declared purpose rather than picked.
    #
    # Phase 2A specified 0.85. At that value three independent quantities miss
    # together - AUC 0.87 vs [0.74, 0.79], prepaid RTO 2.6% vs 4.1%, naive gap
    # 22.5pp vs 19.9pp - and all three land on target at ~2.6-3.0. Mechanism:
    # symmetric logit-scale noise on a LOW baseline probability is convex, so it
    # lifts prepaid RTO disproportionately. Too little noise depresses prepaid
    # RTO and widens the gap, which is exactly the measured pattern.
    # *** FROZEN at the solved value. NOT in the joint solve. ***
    # CAL-11's selection share sits 0.02 from its [0.25, 0.45] ceiling and rose
    # monotonically with noise across the sweep, so anything that raises effective
    # noise breaks CAL-11 before it breaks anything else. Treated as immutable and
    # covered by CAL-09: if a later module needs more noise, that is an
    # escalation, not an adjustment.
    noise_sd: 3.3125                       # solved 2026-08-24, then frozen
    noise_sd_spec_value: 0.85              # what Phase 2A specified; reporting only

# -----------------------------------------------------------------------------
# CONVERSION MODEL - decision A2. Minimal 7-slope behavioural model.
#
# Governs ADDRESS-step and PAYMENT_PAGE abandonment ONLY. Payment-failure
# abandonment is produced by module 11 and must NOT be double-counted here.
# The third calibrated intercept is sanctioned by spec 9.1, which already lists
# conversion_model_alpha0 in calibrated_intercepts.
#
# These seven map to blueprint 3 Branch 5 (checkout friction): fee reveal,
# address friction, promise length, device. Conversion is not a hypothesis-
# bearing surface in Phase 1, so it does not get 21 slopes.
# -----------------------------------------------------------------------------
conversion_model:
  intercept_solved: null                   # machine-written; pinned to CAL-06 68%
  coefficients:                            # FIXED A PRIORI - CAL-09 extended to cover these
    pit_is_new_customer: -0.35
    log_order_value: -0.18
    address_completeness: 0.90
    est_delivery_days_centered: -0.07
    shipping_fee_charged_gt0: -0.45        # the fee-reveal shock
    device_web: -0.25
    cart_size_ge3: -0.12
  noise_sd: 0.30
  # Decision A25 - abandon_step attribution. Deterministic, no new randomness and
  # no new coefficient: the step is the term that contributed the largest
  # NEGATIVE amount to the conversion logit, subject to a fixed precedence.
  # Evaluated top to bottom; the first match wins.
  abandon_step_precedence:
    - step: PAYMENT_FAILURE                # set by module 11c. IMMUTABLE, always wins.
      rule: set_by_payment_module
    - step: FEE_REVEAL
      rule: shipping_fee_gt0_and_largest_negative_contributor
      term: shipping_fee_charged_gt0
    - step: PAYMENT_PAGE
      rule: abandoned_at_or_after_payment_page
    - step: ADDRESS
      rule: otherwise
  # Decision A26 - the address hurdle is drawn BEFORE payment attempts, so a
  # session can never both pay successfully and abandon at the address step.
  #   11a  address-step abandonment draw
  #   11b  payment-page-reach / fee-reveal abandonment draw
  #   11c  payment attempts (sessions reaching payment page AND intending prepaid)
  #   12   assemble final conversion state + abandon_step
  hurdle_order: ["11a", "11b", "11c", "12"]

# -----------------------------------------------------------------------------
# PAYMENT FAILURE - spec 10.2. Runs BEFORE the conversion model.
# -----------------------------------------------------------------------------
payment_failure:
  rail_mix: {UPI_INTENT: 0.34, UPI_COLLECT: 0.22, CARD: 0.21,
             NETBANKING: 0.13, WALLET: 0.10}
  first_attempt_failure: {UPI_INTENT: 0.06, UPI_COLLECT: 0.27, CARD: 0.18,
             NETBANKING: 0.29, WALLET: 0.05}
  customer_failure_multiplier: 0.80        # x (1 + 0.8 * pit_payment_failure_rate)
  downtime_hour_share: 0.03
  downtime_multiplier: 2.20
  p_retry: 0.45
  retry_success: 0.60
  terminal: {switch_to_cod: 0.70, switch_rail: 0.10, abandon: 0.20}
  switch_rail_success: 0.85
  failure_reason_mix: {TIMEOUT: 0.31, BANK_DECLINE: 0.24, OTP_FAILURE: 0.19,
                       PSP_DOWNTIME: 0.12, INSUFFICIENT_FUNDS: 0.09, USER_CANCELLED: 0.05}

# -----------------------------------------------------------------------------
# RTO REASONS - spec 11. Decision A3 (log transform) + A4 (driver weights).
#
#   score(r) = log(base_weight[r]) + sum_d driver_weight[r][d] * driver_value[d]
#   P(r)     = softmax(score) across the ten reasons, within each RTO order
#
# The log transform (decision A3) is a correction to the MATHEMATICAL
# IMPLEMENTATION so the stated base weights are the actual zero-driver
# probabilities. It is NOT a change to the intended distribution.
#
# The softmax normalises across reasons WITHIN an order. NO class-level
# renormalisation is applied: the ADDRESSABLE/STRUCTURAL split is MEASURED from
# the realised draws, never forced. CAL-08 (SOFT) measures it on RTO *cost*.
# If it lands at 61/39, that is reported as a finding. Below 50% -> escalate.
#
# These weights are FROZEN at approval. CAL-10 (HARD) enforces it.
# They will NOT be tuned to make CAL-08 pass.
# -----------------------------------------------------------------------------
rto_reasons:
  base_weights:
    CUSTOMER_REFUSED_CHANGED_MIND: 0.22
    CUSTOMER_UNREACHABLE_NO_ANSWER: 0.14
    ADDRESS_INCORRECT_INCOMPLETE: 0.13
    INSUFFICIENT_CASH_AT_DELIVERY: 0.11
    NEVER_ORDERED_LOW_INTENT: 0.05
    COURIER_OPERATIONAL_FAILURE: 0.10
    CUSTOMER_UNAVAILABLE_GENUINE: 0.09
    PINCODE_SERVICEABILITY_FAILURE: 0.08
    DELIVERY_ATTEMPTED_OUTSIDE_WINDOW: 0.05
    OTHER_UNCLASSIFIED: 0.03
  class_map:
    CUSTOMER_REFUSED_CHANGED_MIND: ADDRESSABLE
    CUSTOMER_UNREACHABLE_NO_ANSWER: ADDRESSABLE
    ADDRESS_INCORRECT_INCOMPLETE: ADDRESSABLE
    INSUFFICIENT_CASH_AT_DELIVERY: ADDRESSABLE
    NEVER_ORDERED_LOW_INTENT: ADDRESSABLE
    COURIER_OPERATIONAL_FAILURE: STRUCTURAL
    CUSTOMER_UNAVAILABLE_GENUINE: STRUCTURAL
    PINCODE_SERVICEABILITY_FAILURE: STRUCTURAL
    DELIVERY_ATTEMPTED_OUTSIDE_WINDOW: STRUCTURAL
    OTHER_UNCLASSIFIED: STRUCTURAL
  # 22 declared coefficients across 8 reasons; 2 reasons deliberately flat.
  # The two C-class coefficients are declared at 0.00 rather than deleted, so the
  # record shows they were considered and ruled to zero (decision A4).
  driver_weights:
    CUSTOMER_REFUSED_CHANGED_MIND:
      latent_intent_z: 0.45
      discount_pct_centered: 0.20
      est_delivery_days_centered: 0.10
      cart_size_ge3: 0.25
    CUSTOMER_UNREACHABLE_NO_ANSWER:
      latent_intent_z: 0.30
      pit_is_new_customer: 0.35
      geo_tier_tier3: 0.30
    ADDRESS_INCORRECT_INCOMPLETE:
      address_completeness: -1.60          # dominant driver; BR-08 depends on it
      serviceability_z: -0.35
      pit_is_new_customer: 0.00            # C-class, RULED TO ZERO (decision A4)
    INSUFFICIENT_CASH_AT_DELIVERY:
      latent_liquidity_z: -0.55
      is_month_end: 0.40
      log_order_value: 0.30
    NEVER_ORDERED_LOW_INTENT:
      latent_intent_z: 0.70
      pit_is_new_customer: 0.40
      cart_size_ge3: 0.30
    COURIER_OPERATIONAL_FAILURE:
      courier_reliability_z: -0.55
      attempt_delay_days_z: 0.00           # C-class, RULED TO ZERO (decision A4)
    CUSTOMER_UNAVAILABLE_GENUINE: {}       # deliberately flat - genuine randomness
    PINCODE_SERVICEABILITY_FAILURE:
      serviceability_z: -0.75
      geo_tier_tier3: 0.35
    DELIVERY_ATTEMPTED_OUTSIDE_WINDOW:
      courier_reliability_z: -0.35
      attempt_delay_days_z: 0.45
    OTHER_UNCLASSIFIED: {}                 # deliberately flat
  # Hard gates - spec 11.2. Enforced, not hoped for.
  gates:
    INSUFFICIENT_CASH_AT_DELIVERY:
      requires_payment_method: COD         # DQ-11: zero probability on prepaid
    NEVER_ORDERED_LOW_INTENT:
      suppress_if_pit_orders_delivered_gte: 5
  # CAL-10 (HARD): sha256 over {base_weights, driver_weights, class_map}.
  # Written at approval time. Any later edit fails the test.
  frozen_hash: "35774eca8875a3575d238dc56dd376950dfbaaa1de8978a6db5bbdec543afb9b"
  # Decision A22 - ndr_code enumeration, mapped deterministically from rto_reason.
  ndr_code_map:
    CUSTOMER_REFUSED_CHANGED_MIND: CUSTOMER_REFUSED
    CUSTOMER_UNREACHABLE_NO_ANSWER: CUSTOMER_UNREACHABLE
    ADDRESS_INCORRECT_INCOMPLETE: ADDRESS_INCOMPLETE
    INSUFFICIENT_CASH_AT_DELIVERY: CASH_NOT_READY
    NEVER_ORDERED_LOW_INTENT: CUSTOMER_REFUSED
    COURIER_OPERATIONAL_FAILURE: COURIER_OPERATIONAL
    CUSTOMER_UNAVAILABLE_GENUINE: CUSTOMER_UNAVAILABLE
    PINCODE_SERVICEABILITY_FAILURE: OUT_OF_DELIVERY_AREA
    DELIVERY_ATTEMPTED_OUTSIDE_WINDOW: ATTEMPT_OUTSIDE_WINDOW
    OTHER_UNCLASSIFIED: OTHER

# -----------------------------------------------------------------------------
# ECONOMICS - spec 12.2, blueprint 6.4 registry
# -----------------------------------------------------------------------------
economics:
  platform_discount_pct: 0.080
  cogs_ratio_mean: 0.750
  cogs_ratio_sd: 0.045
  cogs_ratio_bounds: {lo: 0.60, hi: 0.86}
  forward_freight_base: {METRO: 62, TIER1: 72, TIER2: 86, TIER3: 99}
  forward_freight_weight_factor: {LIGHT: 0.85, MEDIUM: 1.00, HEAVY: 1.45}
  forward_freight_noise_sd: 6
  reverse_freight_multiplier: 1.09
  reverse_freight_noise_sd: 8
  packaging: {LIGHT: 9, MEDIUM: 13, HEAVY: 21}
  packaging_noise_sd: 1.5
  pg_fee_rate: 0.018
  pg_fee_rate_by_rail: {UPI_INTENT: 0.009, UPI_COLLECT: 0.009, CARD: 0.021,
                        NETBANKING: 0.016, WALLET: 0.019}
  cod_handling_rate: 0.015
  cod_handling_fixed: 8
  cod_failed_attempt_fee: 14
  reverse_handling_base: 35
  reverse_handling_noise_sd: 4
  shrink_rate_by_category: {FASHION: 0.12, BEAUTY: 0.10, GROCERY_FMCG: 0.20,
                            HOME_KITCHEN: 0.06, MOBILE_ACC: 0.04, ELECTRONICS: 0.03}
  # Decision A38 (NDR half). Phase 1 6.4's registry says "Support/NDR cost per
  # RTO - 18", a PER-RTO TOTAL, and it is one of the nine lines that produced
  # -309. Phase 2A's `18 + 6 x (attempts-1)` silently reinterpreted 18 as a BASE,
  # and can never return 18 -- an RTO by definition exhausted its attempts.
  # Phase 1 is the senior document, so the registry value is restored and the
  # attempt-sensitivity is kept:
  #     support_ndr_cost = base + slope x delivery_attempts
  # `base` is SOLVED so the realised mean on RTO orders is 18.00 +/-0.50.
  # A LEVEL solve, so CAL-09 is unaffected.
  support_ndr_slope: 3
  support_ndr_base_solved: null            # machine-written
  support_ndr_target_mean: {target: 18.00, tol: 0.50}
  support_delivered: 2
  wc_annual_rate: 0.14
  wc_days_blocked: {dist: lognormal, mu: 3.36, sigma: 0.22}   # mean ~29.5 days
  ops_allocation_delivered: 10
  shipping_fee_charged: 0                  # baseline: free shipping
  cod_fee_charged: 0                       # baseline: no COD fee. INTERVENTION LEVER
  # Decision A23 - cogs_value is the goods value used by the outcome-independent
  # cost lines (shrink, working capital). It is the COUNTERFACTUAL cogs, computed
  # as if delivered, because on an RTO net_revenue is zero yet the goods moved.
  cogs_value_basis: net_revenue_if_delivered
  # Decision A23 - pre-ship cancelled orders carry ZERO on every cost line.
  # Nothing was dispatched, nothing was collected, prepaid is refunded.
  preship_cancel_economics: zero_all_lines
  # Reconciliation targets at a 1,000-rupee GMV order (spec 12.4).
  reconciliation:
    prepaid_delivered_cm:   {target: 112,  tol: 4,  severity: HARD}   # EC-03
    cod_delivered_cm:       {target: 107,  tol: 4,  severity: HARD}   # EC-04
    cod_rto_cash_loss:      {target: -309, tol: 12, severity: HARD}   # EC-05
    cod_rto_economic_cost:  {target: -416, tol: 15, severity: HARD}   # EC-06
    breakeven_rto_prob:     {target: 0.257, tol: 0.008}
    annualised_exposure_cr: {target: 164, lo: 150, hi: 180, severity: SOFT}  # EC-07

# -----------------------------------------------------------------------------
# FULFILMENT - spec 13.2
# -----------------------------------------------------------------------------
fulfilment:
  preship_cancel_rate: {customer: 0.021, seller: 0.014, system: 0.005}
  max_delivery_attempts: 3
  dispatch_lag_days: {dist: lognormal, mu: 0.15, sigma: 0.45}
  outcome_resolution_days: {lo: 4, hi: 25}     # CLAUDE.md invariant 7
  seller_dispatch_late_threshold_days: 2

# -----------------------------------------------------------------------------
# CENSORING - decision A10 (RULED)
#
# Orders whose outcome would resolve after the last day of the window are
# censored: is_censored = TRUE, and rto_flag / is_delivered /
# actual_delivery_days / outcome_resolved_date are all NULL.
#
# RTO-rate denominators (CAL-03/04/05) are shipped AND NOT censored.
# Censored count is reported separately.
#
# DQ-14 requires censoring to be PRESENT: >= 3% of late-window orders.
# Phase 1 11 needs it to DEMONSTRATE maturation bias rather than assert it.
# -----------------------------------------------------------------------------
censoring:
  enabled: true
  rto_denominator: shipped_and_not_censored
  late_window_definition_days: 25          # last 25 days of the window
  min_censored_share_of_late_window: 0.03  # DQ-14 floor

# -----------------------------------------------------------------------------
# PRIORS - decision A19 (RULED). DECLARED CONSTANTS, never computed from the
# generated population.
#
# Computing a shrinkage prior from the realised data would make every customer's
# Stage-1 risk feature a function of the window's Stage-5 outcomes: a
# population-level leak that NO column-level check would catch, and one that
# would inflate LK-03's AUC with no obviously-wrong column in the view. It would
# also move on every bisection iteration, making the feature non-reproducible.
#
# LK-06 (HARD) asserts the prior used at runtime equals the constant below.
# -----------------------------------------------------------------------------
priors:
  rto_prior: 0.165                         # EB prior mean for pit_rto_rate_shrunk
  cod_prior: 0.620
  # Decision A39 follow-on. pit_payment_failure_rate is failures / (successes +
  # failures), so its implied population mean is NOT the blended first-attempt
  # failure rate but that rate divided by (1 + itself):
  #     blended = sum(rail_mix[r] * first_attempt_failure[r]) = 0.1603
  #     prior   = 0.1603 / 1.1603                             = 0.1382
  # Derived ANALYTICALLY from the payment_failure block, never measured from the
  # generated population -- LK-06 asserts it at runtime.
  #
  # Leaving this un-centred put a historyless customer at "has never had a
  # payment fail", which is a positively-biased claim about a customer we know
  # nothing about, and it double-counted against is_new_customer -- the exact
  # mechanism that broke BR-01.
  payment_failure_prior: 0.1382
  shrinkage_k: 8                           # spec 3.7

# -----------------------------------------------------------------------------
# MISSING DATA - decision A18 (RULED). DO NOT IMPUTE.
#
# Imputing a value that is then multiplied by +2.20 (pit_cod_share) manufactures
# a signal that does not exist. A historyless customer's COD share is not 0.62
# and is not 0 -- it is UNKNOWN, and the table says so.
#
# pit_rto_rate_shrunk is the exception: empirical-Bayes shrinkage at n=0 returns
# the declared prior by construction, which is a computed value rather than an
# imputed one. It stays NOT NULL.
#
# In the GENERATOR'S OWN logits a NULL feature contributes exactly 0.0 -- the
# term is switched off, not filled in. The level difference for historyless
# customers is already carried by `pit_is_new_customer` (+0.70 COD / +0.45 RTO),
# an already-declared coefficient. NO NEW COEFFICIENT IS INTRODUCED.
#
# Analyst-side models use the missing-indicator pattern via pit_has_history.
# -----------------------------------------------------------------------------
missing_data:
  policy: null_with_indicator
  indicator_column: pit_has_history         # TRUE when pit_orders_placed > 0
  nullable_when_no_history:
    - pit_cod_share
    - pit_avg_order_value
    - pit_payment_failure_rate
    - pit_days_since_last_order
  never_null:
    - pit_rto_rate_shrunk                   # shrinks fully to priors.rto_prior at n=0
  logit_contribution_when_null: 0.0

# -----------------------------------------------------------------------------
# CALIBRATION SEARCH - solver configuration. Decisions A13, A14, A15.
# These are SOLVER settings, not business assumptions.
# -----------------------------------------------------------------------------
calibration_search:
  # Five calibrated intercepts. ALL ARE LEVELS. Zero slopes move.
  # CAL-09 covers all five blocks.
  pre_window_cod_model:
    bracket: [-3.0, 3.0]                   # pi_cod0; decision A11
    loop_modules: ["07"]
    target: pre_window_cod_share
  pre_window_rto_model:
    bracket: [-6.0, 0.0]                   # pi_rto0; decision A11
    loop_modules: ["07"]
    target: pre_window_rto_rate
  product_price_scalar:
    bracket: [0.5, 2.0]                    # decision A36
    target: mean_gmv_per_order             # measured on ORDERS, not sessions
  cod_model:
    bracket: [-2.0, 2.0]                   # spec 7.3; beta_0 expected ~ +0.30
    # Decision A15: 08-09 are invariant to beta_0 and are cached.
    # Decision A26: module 11 is split into 11a / 11b / 11c.
    loop_modules: ["10", "11a", "11b", "11c", "12", "13"]
    target: cod_share
  rto_model:
    # Decision A7: calibrated against the BLENDED rate alone. CAL-03/04 are
    # emergent and are reported, not solved for.
    bracket: [-6.0, 0.0]                   # decision A14: spec gave no bracket
    loop_modules: ["15", "16", "17"]
    target: rto_rate_blended
  conversion_model:
    bracket: [-4.0, 4.0]
    loop_modules: ["11a", "11b", "12"]
    target: checkout_conversion
  # Decision A13: bisect on the REALISED draw using common random numbers, which
  # makes the realised share a monotone step function of the intercept. Tolerance
  # scales with n, because +/-0.004 is finer than one order's worth at dev scale.
  #   tol = max(share_tolerance_floor, tolerance_n_scaling / sqrt(n_orders))
  share_tolerance_floor: 0.004
  tolerance_n_scaling: 1.5
  max_iterations: 60

# -----------------------------------------------------------------------------
# GROUND TRUTH - decision A6 (RULED). The COD effect is DERIVED, not asserted.
#
# gamma_0 is whatever the calibrator solves to satisfy CAL-03/04/05. It is NOT a
# spec constant and is never moved to make a marginal effect land on 13.4pp.
#
# The canonical effect is the AVERAGE MARGINAL EFFECT over the actual generated
# population of shipped COD orders:
#   AME = mean_i[ logistic(logit_i) - logistic(logit_i - 1.60) ]
# Whatever it is - 12.4, 13.4, 14.1 - that is the truth.
# -----------------------------------------------------------------------------
ground_truth:
  canonical_cod_effect: average_marginal_effect
  # GT-03 re-anchored RELATIVELY, so the test keeps its purpose at any AME value.
  # The old hard-coded [15,19]pp band became invalid once gamma_0 > -3.00: the
  # band would then contain the truth, so an estimate that fully recovered the
  # unobservable would PASS - inverting what the test exists to do.
  #   PASS if AME < adjusted < naive
  #   AND    (adjusted - AME) / (naive - AME) >= 0.35
  gt_03:
    rule: ame_lt_adjusted_lt_naive
    min_gap_closed: 0.35
  # GT-02 reformulated relatively per decision A7. The absolute [18.5, 21.5]
  # band is DROPPED, not replaced with another hard-coded number: it was
  # narrower than CAL-03/04's tolerances jointly permit, so a dataset could pass
  # both calibration tests and still fail GT-02 through no fault of its own.
  # The band's protective job now belongs to CAL-11.
  gt_02:
    rule: naive_gap_gt_ame_and_cal_11_passes
  gt_05:
    auc_ceiling_band: [0.74, 0.79]
    model_within: 0.03
  lk_03_auc_ceiling: 0.85                  # a safe-feature model above this = leak

# -----------------------------------------------------------------------------
# LEAKAGE GUARD - spec 4.2, 4.4. LK-01 and LK-02 assert against these lists.
# -----------------------------------------------------------------------------
leakage_guard:
  safe_feature_whitelist:
    # Stage 1 - known before checkout opens
    - pit_tenure_days
    - pit_orders_placed
    - pit_orders_delivered
    - pit_orders_resolved            # decision A20 - added as a real column
    - pit_rto_count
    - pit_rto_rate_raw
    - pit_rto_rate_shrunk
    - pit_cod_orders
    - pit_cod_share
    - pit_prepaid_success_count
    - pit_payment_failure_count
    - pit_payment_failure_rate
    - pit_days_since_last_order
    - pit_avg_order_value
    - pit_is_new_customer
    - pit_has_clean_record
    - pit_has_history                # decision A18 - the missing indicator
    - pit_risk_tier_rule_based       # decision A21 - Stage 1/2 version only
    - has_saved_prepaid_instrument
    - age_bucket
    - acquisition_channel
    - geo_tier
    - serviceability_score
    - courier_reliability_score
    - cod_cultural_index
    - category
    - list_price
    - product_rating
    - review_count
    - seller_rating
    - seller_rating_count
    - seller_sla_breach_rate
    - is_returnable
    - day_of_week
    - is_month_end_window
    # Stage 2 - during checkout, before payment-method selection
    - cart_size
    - cart_value
    - order_value
    - discount_pct
    - estimated_delivery_days
    - address_completeness_score
    - device_type
    - delivery_geography_id
    - hour_of_day
    # Stage 3 - M2 (post-selection) model ONLY. M1 must project these away.
    - payment_method
    - paid_via_switch
    - payment_attempt_count
    # Keys and target, permitted in the view
    - session_id
    - customer_id
    - session_start_ts
    - rto_flag
    - is_shipped
  hard_blocked:
    - delivery_attempts
    - actual_delivery_days
    - delivery_delay_days
    - attempt_delay_days             # decision A8 - Stage 4 shock input, never a feature
    - rto_reason
    - rto_reason_class
    - ndr_code
    - order_status
    - is_delivered
    - is_cancelled_preship
    - cancel_actor
    - is_censored
    - outcome_resolved_date
    - contribution_margin
    - rto_cash_loss
    - foregone_cm
    - rto_economic_cost
    - counterfactual_cm_if_delivered
    - clv_estimate
    - hist_orders_final
    - hist_rto_rate_final
    - hist_cod_share_final
    - analytics_segment
    - order_risk_tier_rule_based     # decision A21 - M2 baseline, holds payment_method
    - latent_trust
    - latent_liquidity
    - latent_intent
    - latent_price_sensitivity
    - true_cod_propensity
    - p_convert
    - p_cod_intent
    - p_rto_precheckout
    - p_rto_final
    - post_dispatch_shock

# -----------------------------------------------------------------------------
# SEED - spec 16.1. CLAUDE.md invariant 11: APPEND ONLY, never insert.
# -----------------------------------------------------------------------------
seed:
  master: 20260115
  # APPEND ONLY (CLAUDE.md invariant 11). `truth_sampling` was appended for
  # decision A45; SeedSequence derives each child from its POSITION, so adding a
  # name at the end leaves every existing stream byte-identical. DQ-01 proves it:
  # the fct_order hash is unchanged across the append.
  substreams: [date, geography, seller, product, customer, latent, history,
               session, cod, payment, conversion, order, cancel, rto,
               delivery, reason, economics, truth_sampling]

# -----------------------------------------------------------------------------
# DQ-16 ALLOWLIST - decision A46
#
# Columns whose availability legitimately depends on an outcome, declared as
# `table.column@partition`. DQ-16 sweeps every order-linked column across five
# outcome partitions and FAILS on anything flagged that is not declared here.
#
# The declaration unit is (column, PARTITION), not column. A46's own fix is why:
# after it, `attempt_delay_days` is still legitimately absent on CENSORED orders
# but must never again be absent on DELIVERED ones. A bare-column allowlist would
# excuse both and re-open the defect this test exists to close.
#
# ADDING A LINE HERE IS A DECISION. It asserts "this column cannot exist on the
# other arm, by definition" -- not "this column happens to be missing today".
# A46 was invisible for the whole of Phase 2 precisely because nothing forced
# that sentence to be written down.
#
# Not listed, and worth knowing why: the outcome-conditional COST lines
# (cod_handling_cost, reverse_shipping_cost, shrink_cost, ...) do not flag,
# because decision A23 carries them as ZERO rather than NULL on orders they do
# not apply to. Their availability is unconditional; only their value moves.
# -----------------------------------------------------------------------------
dq16_expected_outcome_conditional:
  # An unresolved outcome has no outcome columns at all (decision A10).
  - fct_order.rto_flag@is_censored
  - fct_order.is_delivered@is_censored
  - fct_order.actual_delivery_days@is_censored
  - fct_order.outcome_resolved_date@is_censored
  - fct_order.delivery_attempts@is_censored
  - fct_delivery_event.attempt_number@is_censored
  - fct_delivery_event.attempt_delay_days@is_censored

  # A returned order never delivered, so it has no delivery delay (decision A8).
  - fct_order.delivery_delay_days@rto_flag
  - fct_order.delivery_delay_days@is_delivered

  # Only a returned order has a return reason.
  - fct_order.rto_reason@rto_flag
  - fct_order.rto_reason@is_delivered
  - fct_order.rto_reason_class@rto_flag
  - fct_order.rto_reason_class@is_delivered

  # A non-delivery report exists only on a FAILED attempt (constraint
  # dlv_ndr_needs_fail), and only returned orders have failed attempts.
  - fct_delivery_event.ndr_code@rto_flag
  - fct_delivery_event.ndr_code@is_delivered

  # Only a cancelled order has a cancelling actor.
  - fct_order.cancel_actor@is_shipped

  # A COD order has no payment rail. Test DQ-13 asserts the iff directly.
  - fct_order.payment_rail@payment_method
  # Same fact, carried on the session frame. NOTE: this column is PARQUET-ONLY --
  # the DDL does not declare it and the loader's COPY drops it, so it never
  # reaches the analytics schema. The sweep runs over the parquet frames, which
  # are a SUPERSET of what is published; that is the safer direction, because a
  # working column is caught before anyone decides to publish it.
  - fct_checkout_session.payment_rail@payment_method

# -----------------------------------------------------------------------------
# TRUTH SAMPLING - decision A45
#
# Which sessions get a per-term logit trace in truth_order_probability. These
# columns exist to make GT-01 auditable: a Phase 5 reviewer opens ONE order and
# reads every additive term that produced its probability. That is a lookup, not
# a scan, so the sample is 2,000 sessions rather than all 155,000 - full
# population would cost ~190 MB of JSONB for a query nobody runs in bulk.
#
# Three of the four strata are the cases a reviewer would actually open: a COD
# order that came back, a prepaid order that came back, and an order the
# pre-checkout score called risky that arrived safely. The fourth is an unbiased
# random draw, so the sample is not only its own tail.
#
# Strata may overlap; the union is de-duplicated, so the realised count is at or
# just below 2,000 and is recorded in _truth.json rather than assumed.
# -----------------------------------------------------------------------------
truth_sampling:
  strata:
    random_sessions:      500      # unbiased draw across ALL sessions, orders or not
    cod_rto:              500      # COD, shipped, resolved, returned
    prepaid_rto:          500      # prepaid, shipped, resolved, returned
    high_risk_delivered:  500      # top-decile p_rto_precheckout that DELIVERED
  # Defines "high risk" for the fourth stratum: the quantile of
  # p_rto_precheckout, measured among delivered orders only.
  high_risk_quantile: 0.90

# -----------------------------------------------------------------------------
# CALIBRATION STAMP - machine-written by the calibrator. Never hand-edit.
# loader.py refuses to load solved intercepts whose dgp_sha256 does not match the
# current file, which catches both a hand-edited intercept and a slope edited
# after calibration.
# -----------------------------------------------------------------------------
calibration:
  dgp_sha256: null
  calibration_run_id: null
  calibrated_at_utc: null
